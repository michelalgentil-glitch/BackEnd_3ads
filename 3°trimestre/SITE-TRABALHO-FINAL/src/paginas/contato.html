
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Urban Montion</title>

    <!-- Importação da fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS externo -->
    <link rel="stylesheet" href="../../css/contato.css">
</head>

<body>

    <!-- Faixa de frete grátis -->
    <div class="top-banner">
        🔥 FRETE GRÁTIS EM COMPRAS ACIMA DE
        <span>R$ 499,90</span> 🔥
    </div>

    <!-- Cabeçalho e navegação -->
    <header class="main-header">

        <div class="logo">
            Urban Montion<span>.</span>
        </div>

        <nav class="nav-menu" aria-label="Navegação principal">
            <a href="/">INÍCIO</a>
            <a href="/produtos">PRODUTOS</a>
            <a href="/sobre">SOBRE NÓS</a>
            <a href="/contato" class="active" aria-current="page">
                CONTATO
            </a>
        </nav>

        <div class="cart-icon">
            SACOLA <span class="badge">0</span>
        </div>

    </header>

    <!-- Conteúdo principal -->
    <main class="contact-container">

        <div class="contact-content">

            <!-- Texto de apresentação -->
            <section class="contact-header">

                <span class="subtitle">
                    NOVA COLEÇÃO STREETWEAR
                </span>

                <h1>
                    O DESIGN URBANO<br>
                    QUE TE CONECTA
                </h1>

                <p>
                    Kits exclusivos, moletons pesados e suporte direto
                    com a nossa equipe, prontos para o seu drop.
                    Entre em contato conosco!
                </p>

            </section>

            <!-- Formulário de contato -->
            <form
                class="contact-form"
                id="contactForm"
            >

                <div class="form-group">
                    <label for="name">NOME COMPLETO</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ex: João Silva"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-MAIL</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu-email@dominio.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">MENSAGEM</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Escreva sua mensagem aqui..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    ENVIAR MENSAGEM
                </button>

                <p id="formStatus" role="status" aria-live="polite"></p>

            </form>

        </div>

    </main>

    <!-- Envio demonstrativo do formulário -->
    <script>
        const contactForm = document.getElementById('contactForm');
        const formStatus = document.getElementById('formStatus');

        contactForm.addEventListener('submit', function (event) {
            event.preventDefault();

            formStatus.textContent =
                'Formulário preenchido! O envio real precisa ser conectado a um servidor ou serviço de mensagens.';

            contactForm.reset();
        });
    </script>

</body>
</html>
